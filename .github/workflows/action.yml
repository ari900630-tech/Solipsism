name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build :app:assembleSolipsismBrowserDebug
      - name: Check dependency sorting
        run: ./gradlew checkSortDependencies
      - name: Check localization resources
        run: python3 scripts/check_localized_resources.py
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Solipsism-Browser-debug-APK
          path: app/build/outputs/apk/solipsismBrowser/debug/*.apk
          if-no-files-found: error
          retention-days: 14
